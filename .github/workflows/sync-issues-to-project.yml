name: Sync all org issues and PRs to project

on:
  schedule:
    - cron: '*/30 6-19 * * *'
  workflow_dispatch:

env:
  ORG: MuTech-BV
  PROJECT_NUMBER: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ISSUE_DASHBOARD_APP_ID }}
          private-key: ${{ secrets.ISSUE_DASHBOARD_APP_KEY }}
          owner: MuTech-BV

      - name: Sync open issues and PRs to project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Searching open issues..."
          ISSUES=$(gh search issues \
            --owner "$ORG" \
            --state open \
            --json url \
            -q '.[].url' \
            --limit 1000)

          echo "Searching open PRs..."
          PRS=$(gh search prs \
            --owner "$ORG" \
            --state open \
            --json url \
            -q '.[].url' \
            --limit 1000)

          TOTAL=$(echo "$ISSUES $PRS" | wc -w | tr -d ' ')
          echo "Found $TOTAL open items. Ensuring all are on the project..."

          for url in $ISSUES $PRS; do
            gh project item-add "$PROJECT_NUMBER" \
              --owner "$ORG" \
              --url "$url" > /dev/null 2>&1 || echo "Failed: $url"
          done

          echo "Sync complete. Processed $TOTAL items."
