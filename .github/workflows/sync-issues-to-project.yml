name: Sync all org issues and PRs to project

on:
  schedule:
    - cron: '*/30 6-19 * * *'
  workflow_dispatch:

env:
  ORG: MuTech-BV
  PROJECT_NUMBER: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ISSUE_DASHBOARD_APP_ID }}
          private-key: ${{ secrets.ISSUE_DASHBOARD_APP_KEY }}
          owner: MuTech-BV

      - name: Sync open issues and PRs to project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Step 1: Fetch all project item URLs via GraphQL (paginated)
          EXISTING=""
          CURSOR=""
          PAGE=0
          while true; do
            PAGE=$((PAGE + 1))
            if [ -z "$CURSOR" ]; then
              AFTER="null"
            else
              AFTER="\"$CURSOR\""
            fi

            RESULT=$(gh api graphql -f query="
              query {
                organization(login: \"$ORG\") {
                  projectV2(number: $PROJECT_NUMBER) {
                    items(first: 100, after: $AFTER) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        content {
                          ... on Issue { url }
                          ... on PullRequest { url }
                        }
                      }
                    }
                  }
                }
              }
            ")

            URLS=$(echo "$RESULT" | jq -r '
              .data.organization.projectV2.items.nodes[]
              | .content.url // empty
            ')
            EXISTING="${EXISTING}${URLS}"$'\n'

            HAS_NEXT=$(echo "$RESULT" | jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage')
            [ "$HAS_NEXT" = "true" ] || break
            CURSOR=$(echo "$RESULT" | jq -r '.data.organization.projectV2.items.pageInfo.endCursor')
          done

          EXISTING_COUNT=$(echo "$EXISTING" | grep -c . || true)
          echo "Fetched $EXISTING_COUNT project items in $PAGE page(s)."

          # Step 2: Search open issues + PRs
          echo "Searching open issues..."
          ISSUES=$(gh search issues \
            --owner "$ORG" \
            --state open \
            --json url \
            -q '.[].url' \
            --limit 1000)

          echo "Searching open PRs..."
          PRS=$(gh search prs \
            --owner "$ORG" \
            --state open \
            --json url \
            -q '.[].url' \
            --limit 1000)

          TOTAL=$(echo "$ISSUES $PRS" | wc -w | tr -d ' ')
          echo "Found $TOTAL open items."

          # Step 3: Sanity check — if project query returned 0 items, don't blindly re-add everything
          if [ "$EXISTING_COUNT" -eq 0 ] && [ "$TOTAL" -gt 50 ]; then
            echo "::error::Project item query returned 0 items but found $TOTAL open items. Aborting to avoid duplicate adds."
            exit 1
          fi

          # Step 4: Diff and add missing
          ADDED=0
          SKIPPED=0
          for url in $ISSUES $PRS; do
            if echo "$EXISTING" | grep -qF "$url"; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            echo "Adding: $url"
            gh project item-add "$PROJECT_NUMBER" \
              --owner "$ORG" \
              --url "$url" > /dev/null 2>&1 \
              && ADDED=$((ADDED + 1)) || echo "  Failed: $url"
          done

          echo "Sync complete. Skipped $SKIPPED existing, added $ADDED new items."
